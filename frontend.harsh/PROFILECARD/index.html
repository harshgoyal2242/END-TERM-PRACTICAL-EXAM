<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card - Arjun Kumar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .card {
      width: 300px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      overflow: hidden;
      padding-bottom: 24px;
    }

    .banner {
      height: 100px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .avatar {
      width: 90px;
      height: 90px;
      background-color: #facc15;
      border: 4px solid #ffffff;
      border-radius: 50%;
      margin: -45px auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: #1f2937;
    }

    h2 {
      font-size: 20px;
      color: #111827;
      margin-bottom: 4px;
    }

    .role {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .skills {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .skills li {
      background-color: #e5e7eb;
      color: #374151;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .followers {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 16px;
    }

    .follow-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: 2px solid #2563eb;
      padding: 8px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .follow-btn.following {
      background-color: #ffffff;
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="banner"></div>
    <div class="avatar">AK</div>
    <h2>Arjun Kumar</h2>
    <p class="role">Web Developer</p>
    
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>Git</li>
    </ul>

    <p class="followers"><span id="follower-count">120</span> followers</p>
    <button id="follow-btn" class="follow-btn">Follow</button>
  </div>

  <script>
    const followBtn = document.getElementById('follow-btn');
    const followerCount = document.getElementById('follower-count');

    followBtn.addEventListener('click', () => {
      const isFollowing = followBtn.classList.toggle('following');

      if (isFollowing) {
        followBtn.textContent = 'Following';
        followerCount.textContent = '121';
      } else {
        followBtn.textContent = 'Follow';
        followerCount.textContent = '120';
      }
    });
  </script>

</body>
</html>
