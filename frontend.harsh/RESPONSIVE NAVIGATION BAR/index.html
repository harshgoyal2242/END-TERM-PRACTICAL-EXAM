<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShop - Responsive Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Requirement 1: Header with logo, hamburger button, and nav links -->
  <header class="navbar">
    <div class="logo">MyShop</div>
    <button id="menu-btn" class="menu-btn">&#9776;</button>
    <nav id="nav-menu" class="nav-links">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Requirement 1: Main section -->
  <main>
    <h1>Welcome to MyShop</h1>
    <p>Resize the browser window to see the menu change.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
